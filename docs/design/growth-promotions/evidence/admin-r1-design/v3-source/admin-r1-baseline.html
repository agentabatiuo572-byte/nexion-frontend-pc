function ruleEditor(key){

function budgetEditor(){return '<fieldset class="form-section"><legend>资产预算 · 分币填写</legend><div class="grid2">'+money('USDT 总预算',modalState==='error'?'1000.000000':'10000.000000',modalState==='error'?'低于当前占用 1,520.000000 USDT；保留输入并拒绝提交。':'')+money('NEX 总预算','100000.000000')+'</div>'+summary([['USDT 已成交义务 / 待支付预留','1,280.000000 / 240.000000'],['NEX 已成交义务 / 待支付预留','12,000.000000 / 3,000.000000']])+'</fieldset><fieldset class="form-section"><legend>赠品额度 · 每个设备单独填写</legend><div class="grid2">'+numeric('赠品设备 B 总额度（台）','200')+numeric('赠品设备 C 总额度（台）','100')+'</div>'+summary([['赠品设备 B 已占用 / 预留','48 台 / 8 台'],['赠品设备 C 已占用 / 预留','12 台 / 4 台']])+'</fieldset><p class="help">以上是固定测试快照，不由浏览器重新计算业务额度。已成交但发放失败的义务继续占用；实际追回前不释放。</p>';}
function dispositionFields(key){

 if(reward)content+='<fieldset class="form-section"><legend>处置证据<span class="req">*</span></legend><label class="evidence-choice"><input type="checkbox" name="evidence" '+(modalState!=='normal'?'checked':'')+'><span>关联订单处理记录 · DEMO-102 · 原承诺与退款 / 差错裁决证据</span></label><label class="evidence-choice"><input type="checkbox" name="evidence"><span>原命令执行记录与资金凭证 · 只读测试证据</span></label><small>至少选择一份可访问、与该原义务关联的证据；活动结束不构成取消依据。</small></fieldset>';
 if(key==='adjudicate')content+=field('有依据的后续处理',select(['证据不足，继续人工审阅','已有资产回执，继续核账确认','证据确认未发，进入原义务恢复']),'不提供任意终态、自由金额或新受益人输入。');

function showModal(key,trigger){if(trigger&&!dialog.contains(trigger))lastTrigger=trigger;else if(!dialog.open)lastTrigger=document.activeElement;const [title,copy]=modalText[key]||['设计操作样例','本操作只用于查看画板，没有业务写入。'];const sensitive=sensitiveKeys.has(key);document.getElementById('dialog-title').textContent=title;let content='<p>'+copy+'</p>';dialog.dataset.modalKey=key;dialog.classList.toggle('wide-dialog',editorKeys.has(key)||evidenceKeys.has(key));

content+=notice('仅设计演示','所有样例引用、金额与操作均不代表真实政策或执行结果。')+'<div class="modal-result" role="status" id="modal-result"></div>';document.getElementById('dialog-content').innerHTML=content;const confirm=document.getElementById('dialog-confirm');confirm.textContent=sensitive||editorKeys.has(key)?'确认查看样例':'返回画板';confirm.dataset.sensitive=String(sensitive);confirm.disabled=isDisabled&&writeActions.has(key);if(confirm.disabled)dialog.querySelectorAll('input,select,textarea').forEach(el=>el.disabled=true);if(!dialog.open)dialog.showModal();}
document.addEventListener('click',event=>{

});
document.addEventListener('change',event=>{
 if(event.target.matches('[data-reward-type]')){const role=event.target.dataset.rewardType;dialog.querySelector('[data-type-confirm="'+role+'"]').innerHTML=event.target.value===event.target.dataset.current?'':notice('切换奖励类型会清空原类型字段','只改变当前受益人的一项奖励；另一名受益人保持原值。','warn')+'<div class="actions"><button class="btn" data-cancel-type="'+role+'">保留原类型</button><button class="btn" data-confirm-type="'+role+'">确认切换并清空</button></div>';}

dialog.addEventListener('close',()=>lastTrigger?.focus());document.getElementById('dialog-confirm').addEventListener('click',event=>{

 if(sensitiveKeys.has(key)){const reason=dialog.querySelector('textarea[name=reason]');if(reason.value.trim().length<8){result.textContent='请填写至少 8 字的样例理由。';reason.focus();return;}if(evidenceKeys.has(key)&&!dialog.querySelector('input[name=evidence]:checked')){result.textContent='请选择至少一份关联证据；证据不足不能执行。';return;}}

  const invalid=[...dialog.querySelectorAll('input,select')].find(el=>!el.checkValidity()||el.matches('[aria-invalid=true]')||(el.tagName==='SELECT'&&el.selectedOptions[0].textContent.startsWith('请选择'))||(el.matches('[data-money]')&&/^0+(\.0+)?$/.test(el.value)));

 }
 if(modalState!=='normal'&&writeActions.has(key)){result.textContent=modalState==='error'?'输入、理由和证据已保留；请先核对字段或最新版本，不写入业务。':'仍需回查原命令结果；不会创建第二条命令。';return;}

});
for(const [id,values,current]of[['screen-picker',Object.fromEntries(Object.entries(screens).map(([k,v])=>[k,k+' · '+v[0]])),screen],['state-picker',states,state]]){const el=document.getElementById(id);el.innerHTML=Object.entries(values).map(([key,value])=>'<option value="'+key+'">'+value+'</option>').join('');el.value=current;}document.getElementById('theme-picker').value=theme;for(const id of ['screen-picker','state-picker','theme-picker'])document.getElementById(id).addEventListener('change',()=>{location.search=new URLSearchParams({screen:document.getElementById('screen-picker').value,state:document.getElementById('state-picker').value,theme:document.getElementById('theme-picker').value});});
