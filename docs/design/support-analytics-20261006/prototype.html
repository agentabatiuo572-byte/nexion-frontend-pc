document.addEventListener('error',e=>{if(e.target?.tagName==='IMG'&&e.target.closest('.avatar')){e.target.hidden=true;e.target.closest('.avatar').setAttribute('data-image-state','fallback');}},true);
const avatarPools={male:['men-40.jpg','men-84.jpg','men-75.jpg','men-83.jpg','men-82.jpg'],female:['women-39.jpg','women-87.jpg','women-21.jpg','women-85.jpg','women-7.jpg']};
const identityPhotos={'Mia':'women-39.jpg','林海':'men-75.jpg','小雨儿':'women-21.jpg','陈默':'men-82.jpg','Sunny':'women-85.jpg','阿凯':'men-40.jpg','胡宁':'men-83.jpg','何青':'women-87.jpg','顾明':'men-84.jpg','安宁':'women-7.jpg','陆泽':'men-40.jpg','简一':'women-39.jpg','顾晓':'women-85.jpg','顾星':'men-82.jpg','张晓雨':'women-87.jpg','王浩然':'men-40.jpg','李思琪':'women-21.jpg','陈子航':'men-84.jpg','周芷宁':'women-85.jpg','杨帆':'men-83.jpg','周凯':'men-82.jpg','孙怡':'women-7.jpg','林思远':'men-40.jpg','许安':'men-84.jpg','Chen':'men-83.jpg','Admin':'men-82.jpg'};
const staffGenders={'Mia':'female','张晓雨':'female','王浩然':'male','李思琪':'female','陈子航':'male','周芷宁':'female','杨帆':'male','周凯':'male','孙怡':'female'};
const allAvatarFiles=[...avatarPools.male,...avatarPools.female],accountStorageKey='uvel-support-design-accounts-v1';
let staffDraft=null,accountStorageWarning='';
function validAccountStore(value){return value?.version===1&&Array.isArray(value.items)&&value.items.every(a=>typeof a.id==='string'&&typeof a.name==='string'&&a.name.trim().length>0&&[...a.name].length<=40&&['male','female','unspecified'].includes(a.gender)&&allAvatarFiles.includes(a.avatar))&&value.overrides&&typeof value.overrides==='object'&&!Array.isArray(value.overrides)&&Object.entries(value.overrides).every(([name,file])=>Object.hasOwn(staffGenders,name)&&allAvatarFiles.includes(file));}
function loadDesignAccounts(){try{const raw=typeof localStorage==='undefined'?null:localStorage.getItem(accountStorageKey);if(!raw)return {version:1,items:[],overrides:{}};const value=JSON.parse(raw);if(!validAccountStore(value))throw new Error('invalid');return value;}catch{accountStorageWarning='本地账号样例无法读取，未覆盖原保存内容。';return {version:1,items:[],overrides:{}};}}
let designAccounts=loadDesignAccounts();
function avatarFile(c){return c.photo||designAccounts.overrides[c.name]||identityPhotos[c.name]||null;}
function randomAvatar(gender,exclude=''){const pool=gender==='male'?avatarPools.male:gender==='female'?avatarPools.female:allAvatarFiles;const choices=pool.filter(file=>file!==exclude);return choices[Math.floor(Math.random()*choices.length)];}
const genderLabel=value=>({male:'男',female:'女',unspecified:'未指定'}[value]||'未指定');
function openStaffAccounts(){if(role!=='admin'){openDialog('无客服账号管理权限','<p>此设计入口仅向总管理员开放。</p>');return;}const rows=accountSamples.map(a=>({...a,id:'existing:'+a.name,gender:staffGenders[a.name]||'unspecified',avatar:avatarFile(a),existing:true})).concat(designAccounts.items);openDialog('客服账号 · 本地样例',`<p>复用现有客服账号入口。下面的头像是真人照片样例，与姓名对应关系仅用于设计；性别由显式字段提供，不从姓名或照片推断。</p>${accountStorageWarning?'<p class="field-error">'+accountStorageWarning+'</p>':''}<div class="table-scroll"><table><thead><tr><th>姓名 / 头像</th><th>性别</th><th>记录来源</th><th>下一步</th></tr></thead><tbody>${rows.map(a=>`<tr><td><div class="row">${avatar({name:a.name,photo:a.avatar,initial:a.name[0]})}<strong>${esc(a.name)}</strong></div></td><td>${genderLabel(a.gender)}</td><td>${a.existing?'既有客服演示记录':'本地新建样例 · 不计统计'}</td><td><button data-staff-edit="${esc(a.id)}">更换头像${a.existing?'':' / 编辑'}</button></td></tr>`).join('')}</tbody></table></div><div class="dialog-foot"><button data-staff-create class="btn-primary">新建客服样例</button></div><p class="info-strip">仅保存本地头像与样例，不创建真实账号、不授予角色、不加入组或经营统计。正式头像上传沿用原模块，本轮只提供图库选择。</p>`);}
function openStaffForm(id){if(role!=='admin')return;const existing=id?.startsWith('existing:')?accountSamples.find(a=>'existing:'+a.name===id):null,local=designAccounts.items.find(a=>a.id===id);if(id&&!existing&&!local)return;staffDraft=existing?{id,name:existing.name,gender:staffGenders[existing.name]||'unspecified',avatar:avatarFile(existing),existing:true,manual:true}:local?{...local,existing:false,manual:true}:{id:'ACCOUNT-DEMO-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),name:'',gender:'unspecified',avatar:randomAvatar('unspecified'),existing:false,manual:false};renderStaffForm();}
function renderStaffForm(){if(role!=='admin'||!staffDraft)return;const a=staffDraft;openDialog(a.existing?'更换客服头像 · '+a.name:a.name?'编辑客服样例':'新建客服样例',`<form id="staffSampleForm"><div class="row" style="margin-bottom:12px"><span id="staffAvatarPreview">${avatar({name:a.name||'样例',photo:a.avatar,initial:'客'},'large')}</span><div><strong>默认真人头像样例</strong><p class="note">创建时按显式性别随机；刷新与反复打开不重新随机。</p><button type="button" data-staff-random>换一张</button></div></div><label class="field-label" for="staffSampleName">客服姓名</label><input id="staffSampleName" maxlength="40" value="${esc(a.name)}" ${a.existing?'disabled':''} placeholder="必填，最多40字"><label class="field-label" for="staffSampleGender">性别</label><select id="staffSampleGender" ${a.existing?'disabled':''}>${[['unspecified','未指定'],['male','男'],['female','女']].map(([value,label])=>`<option value="${value}" ${a.gender===value?'selected':''}>${label}</option>`).join('')}</select><p class="note" style="margin-top:8px">未指定使用混合图库。已保存头像及手动选择不随性别修改自动替换，可主动“换一张”或选择图库。</p><h3>选择图库头像</h3><div class="avatar-gallery">${allAvatarFiles.map(file=>`<button type="button" data-staff-photo="${file}" class="${a.avatar===file?'selected':''}" aria-label="选择${avatarPools.male.includes(file)?'男':'女'}头像 ${(avatarPools.male.includes(file)?avatarPools.male:avatarPools.female).indexOf(file)+1}" aria-pressed="${a.avatar===file}">${avatar({photo:file,initial:'客'})}</button>`).join('')}</div><p id="staffSampleError" class="field-error" role="alert"></p><div class="dialog-foot"><button type="button" data-action="staffAccounts">取消</button><button class="btn-primary" type="submit">保存本地样例</button></div><p class="note">姓名和照片仅作设计样例；未创建真实客服账号，未更改任何业务权限。</p></form>`);}
function captureStaffDraft(){if(!staffDraft)return;if(!staffDraft.existing){staffDraft.name=$('#staffSampleName').value;staffDraft.gender=$('#staffSampleGender').value;}}
function saveStaffSample(){if(role!=='admin'||!staffDraft)return;captureStaffDraft();const name=staffDraft.name.trim();if(!name||[...name].length>40||!allAvatarFiles.includes(staffDraft.avatar)||!['male','female','unspecified'].includes(staffDraft.gender)){$('#staffSampleError').textContent='请填写1–40字姓名，选择性别与可用图库头像。';return;}const next={version:1,items:designAccounts.items.map(a=>({...a})),overrides:{...designAccounts.overrides}};if(staffDraft.existing)next.overrides[name]=staffDraft.avatar;else{const record={id:staffDraft.id,name,gender:staffDraft.gender,avatar:staffDraft.avatar},index=next.items.findIndex(a=>a.id===record.id);if(index<0)next.items.push(record);else next.items[index]=record;}try{localStorage.setItem(accountStorageKey,JSON.stringify(next));designAccounts=next;staffDraft=null;accountStorageWarning='';render();openStaffAccounts();announce('本地客服样例已保存，未创建真实账号。');}catch{$('#staffSampleError').textContent='本地存储不可用，未保存；表单和头像候选保留，可重试。';}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.action==='staffAccounts'){openStaffAccounts();return;}if(b.hasAttribute('data-staff-create')){openStaffForm();return;}if(b.dataset.staffEdit){openStaffForm(b.dataset.staffEdit);return;}if(role!=='admin'||!staffDraft)return;if(b.hasAttribute('data-staff-random')){captureStaffDraft();staffDraft.avatar=randomAvatar(staffDraft.gender,staffDraft.avatar);staffDraft.manual=true;renderStaffForm();}if(b.dataset.staffPhoto&&allAvatarFiles.includes(b.dataset.staffPhoto)){captureStaffDraft();staffDraft.avatar=b.dataset.staffPhoto;staffDraft.manual=true;renderStaffForm();}});
document.addEventListener('change',e=>{if(e.target.id==='staffSampleGender'&&role==='admin'&&staffDraft){captureStaffDraft();if(!staffDraft.manual)staffDraft.avatar=randomAvatar(staffDraft.gender);renderStaffForm();}});
document.addEventListener('submit',e=>{if(e.target.id==='staffSampleForm'){e.preventDefault();saveStaffSample();}});
render();
</script>
</body>
</html>
