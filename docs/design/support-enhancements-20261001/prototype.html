function renderAvatar(){let readonly=scenario==='supervisor';app.innerHTML=`<div class="page stack"><div class="row between"><h1>A1 · ${avatarMode==='create'?'创建顾问 / 客服':'编辑顾问头像'}</h1><span class="pill">${readonly?'仅超管可修改':'超管设计视图'}</span></div><section class="panel stack"><div class="row"><button id="avatar-create">创建顾问 / 客服</button><button id="avatar-edit">编辑既有顾问</button></div><div class="formgrid"><label>姓名<input id="advisor-name" value="${escapeText(avatarForm.name)}" ${readonly||avatarMode==='edit'?'disabled':''}></label><label>角色<select id="advisor-role" ${readonly||avatarMode==='edit'?'disabled':''}><option ${avatarForm.role==='顾问'?'selected':''}>顾问</option><option ${avatarForm.role==='客服'?'selected':''}>客服</option></select></label><label>账号状态<select id="advisor-status" ${readonly||avatarMode==='edit'?'disabled':''}><option ${avatarForm.status==='启用'?'selected':''}>启用</option><option ${avatarForm.status==='停用'?'selected':''}>停用</option></select></label></div>${avatarMode==='edit'?'<dl class="kv"><dt>用户名 / 显示名</dt><dd>mia-design / Mia（只读示例）</dd><dt>邮箱</dt><dd>mia@example.invalid（只读示例）</dd></dl><p class="notice">头像单独保存；不覆盖用户名、显示名、邮箱和其它账号资料。</p>':''}<h2>对客头像</h2><div class="row"><div class="stack"><span class="muted">${avatarMode==='create'?'姓名占位':'原头像'}</span>${avatarUrl?`<img class="preview-image" src="${avatarUrl}" alt="原头像">`:'<span class="avatar big advisor">M</span>'}</div><div class="stack"><span class="muted">替换预览</span>${avatarCandidate?`<img class="preview-image" src="${avatarCandidate}" alt="替换预览">`:'<span class="avatar big">待选</span>'}</div><div class="stack"><label>选择头像<input id="avatar-file" type="file" accept="image/png,image/jpeg" ${readonly?'disabled':''}></label><div class="row"><button id="avatar-remove">移除预览</button><button id="avatar-failure" ${!avatarCandidate?'disabled':''}>查看上传失败</button><button id="avatar-retry" ${!avatarCandidate?'disabled':''}>重试上传预览</button></div></div></div><p id="avatar-status" class="muted" role="status">${avatarCandidate?(avatarReady?'本地上传成功预览；尚未保存':'本地图片已选；尚未上传'): '已有无头像账号显示姓名占位；不因此停用或解绑。'}</p><label>对外昵称<input id="advisor-nickname" value="${escapeText(avatarForm.nickname)}" ${readonly||avatarMode==='edit'?'disabled':''}></label><div class="notice">只有超管可修改顾问头像；客户头像只读。当前头像引用一份资源，账号/坐席不建双源。历史消息作者身份不因转绑或改头像改变。</div><p class="muted">上传类型、容量、像素、存储由真实上传策略返回；本图里的 5MB 不作为要求。本期头像可选，现有无头像不阻断账号创建或坐席启用；取消/失败保留原头像。</p><div class="footer"><button id="avatar-cancel">取消替换</button><button id="avatar-save" class="primary" ${readonly||avatarInvalid||(avatarCandidate?!avatarReady:avatarMode!=='create')?'disabled':''}>预览保存</button></div></section></div>`;
[['advisor-name','name'],['advisor-nickname','nickname'],['advisor-role','role'],['advisor-status','status']].forEach(([id,key])=>$(id).oninput=e=>avatarForm[key]=e.target.value);$('avatar-create').onclick=()=>{avatarGeneration++;avatarMode='create';renderAvatar()};$('avatar-edit').onclick=()=>{avatarGeneration++;avatarMode='edit';renderAvatar()};$('avatar-file').onchange=async e=>{let file=e.target.files[0];if(!file)return;const generation=++avatarGeneration,mode=avatarMode;if(!['image/png','image/jpeg'].includes(file.type)){avatarReady=false;avatarInvalid=true;renderAvatar();$('avatar-status').textContent='图片类型不支持，原头像保留；请选择 PNG / JPEG 或移除预览';return}try{const bitmap=await createImageBitmap(file);bitmap.close();if(scenario!=='normal'||generation!==avatarGeneration||mode!==avatarMode)return;if(avatarCandidate)URL.revokeObjectURL(avatarCandidate);avatarFile=file;avatarCandidate=URL.createObjectURL(file);avatarReady=false;avatarInvalid=false;renderAvatar()}catch{if(scenario!=='normal'||generation!==avatarGeneration||mode!==avatarMode)return;avatarReady=false;avatarInvalid=true;renderAvatar();$('avatar-status').textContent='图片无法读取，原头像保留；重新选择或移除预览'}};$('avatar-remove').onclick=()=>{avatarGeneration++;if(avatarCandidate)URL.revokeObjectURL(avatarCandidate);avatarCandidate='';avatarFile=null;avatarReady=false;avatarInvalid=false;renderAvatar()};$('avatar-cancel').onclick=$('avatar-remove').onclick;$('avatar-failure').onclick=()=>{avatarReady=false;$('avatar-save').disabled=true;$('avatar-status').innerHTML='<span class="bad">上传失败 · 原头像继续使用，所选预览保留；可重试或取消。</span>'};$('avatar-retry').onclick=()=>{if(avatarInvalid||!avatarCandidate)return;avatarReady=true;$('avatar-save').disabled=readonly;$('avatar-status').textContent='本地上传成功预览，未连接服务；可以预览保存'};$('avatar-save').onclick=()=>{if(readonly||avatarInvalid||(avatarCandidate?!avatarReady:avatarMode!=='create'))return;openModal('顾问头像保存预览',`<p>${avatarMode==='create'?'创建账号':'编辑顾问'}：${escapeText($('advisor-name').value)} · ${escapeText($('advisor-role').value)}</p><p>对外昵称：${escapeText($('advisor-nickname').value)}</p>${avatarCandidate?`<img class="preview-image" src="${avatarCandidate}" alt="待保存头像预览">`:'<p>尚未选头像，显示姓名占位；本期头像可选，不阻断创建。</p>'}<p class="muted">本地示例，不创建真实账号；历史作者身份不变。</p>`,[{text:'取消',action:closeModal},{text:'应用本地头像预览',primary:true,action:()=>{if(avatarFile){if(avatarUrl)URL.revokeObjectURL(avatarUrl);avatarUrl=URL.createObjectURL(avatarFile)}if(avatarCandidate)URL.revokeObjectURL(avatarCandidate);avatarCandidate='';avatarReady=false;closeModal();renderAvatar();$('avatar-status').textContent='本地头像预览已更新；刷新不会写入或假装保存在业务服务。'}}])}}
new ResizeObserver(()=>document.documentElement.style.setProperty('--preview-header-height',document.querySelector('.banner').offsetHeight+document.querySelector('.top').offsetHeight+'px')).observe(document.querySelector('.top'));
render();
</script>
</body></html>
