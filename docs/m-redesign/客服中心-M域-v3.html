<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>客服中心 · 域 M · 坐席驾驶舱 v3</title>
<!--
  Nexion 运营后台 · 客服中心(域 M) 全新设计原型 · v3
  v3 定调(主人):顾问 = 人工客服的一种身份分类(客服 / 顾问 / Nova AI),顾问转化能力留在客服中心 M。
    · 坐席身份分客服类 / 顾问类;Mia 同时挂 客服「Mia」+ 顾问「Nova 私享顾问」。
    · 会话类别:专属顾问 / 普通客服 / Nova AI(只读,I2 管)。
    · M5 恢复 顾问主动推送策略(总开关/延迟/冷却/上限/受众圈定) + 顾问主动话术库(可带 →商城/→锁仓 跳转标记)。
    · 主动发起会话:身份可选 客服 / 顾问,目标单人/人群,话术含服务/转化两类。
  铁律:顾问话术对用户呈现可带转化跳转,但正文不写自曝数字(无 95% 年化 / 40% 产出),用定性表述。
  保留 v2 两项:M2 案件台(状态流水线 + 案件字段 + 时间线 log) / M3 三栏(队列｜聊天｜用户上下文栏)。
  暂留:完整 j/k 队列键盘导航、批量归档;真续聊/在线态由服务端会话驱动,原型为本地态。
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#09090B; --surface:#101013; --surface-2:#16161B; --surface-3:#1D1D24; --surface-4:#26262F;
  --border:rgba(255,255,255,.07); --border-2:rgba(255,255,255,.12); --border-3:rgba(255,255,255,.18);
  --ink:#F3F5F9; --ink-2:#C0C6D2; --ink-3:#878FA0; --ink-4:#5A6273; --ink-5:#3E4554;
  --sky:#38BDF8; --sky-2:#7DD3FC; --sky-soft:rgba(56,189,248,.13); --sky-line:rgba(56,189,248,.34); --sky-deep:rgba(56,189,248,.06);
  --ok:#34D399; --ok-soft:rgba(52,211,153,.13);
  --warn:#FBBF24; --warn-soft:rgba(251,191,36,.13);
  --bad:#F87171; --bad-soft:rgba(248,113,113,.13);
  --urgent:#FB7185; --urgent-soft:rgba(251,113,133,.14); --urgent-line:rgba(251,113,133,.4);
  --advisor:#C084FC; --advisor-soft:rgba(192,132,252,.13); --advisor-line:rgba(192,132,252,.3);
  --r:14px; --r-sm:9px; --r-xs:6px; --r-pill:999px;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --disp:"Space Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
#root{height:100vh;overflow:hidden}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--surface-4);border-radius:99px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--ink-5)}
::-webkit-scrollbar-track{background:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;color:inherit;font-size:inherit}
select.inp{appearance:none}
.mono{font-family:var(--mono);letter-spacing:0}
.tnum{font-variant-numeric:tabular-nums}

/* shell */
.shell{display:grid;grid-template-columns:52px 1fr;height:100vh}
.rail{background:#060608;border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:3px}
.rail-logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--sky),#0EA5E9);display:grid;place-items:center;color:#04121b;font-weight:700;font-family:var(--disp);font-size:15px;margin-bottom:10px}
.rail-d{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--ink-4);font-family:var(--disp);position:relative;transition:.12s}
.rail-d:hover{background:var(--surface-2);color:var(--ink-2)}
.rail-d.on{color:var(--sky);background:var(--sky-soft)}
.rail-d.on::before{content:"";position:absolute;left:-12px;top:7px;bottom:7px;width:3px;border-radius:99px;background:var(--sky)}
.main{display:flex;flex-direction:column;min-width:0;height:100vh}

/* topbar */
.top{height:56px;flex:0 0 56px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:18px;padding:0 22px;background:linear-gradient(180deg,var(--surface),var(--bg))}
.crumb{display:flex;align-items:center;gap:9px;font-size:13px}
.crumb .dom{display:flex;align-items:center;gap:7px;color:var(--ink);font-weight:600}
.crumb .dom .dot{width:8px;height:8px;border-radius:99px;background:var(--sky);box-shadow:0 0 0 4px var(--sky-soft)}
.crumb .sep{color:var(--ink-5)}
.crumb .code{font-family:var(--mono);font-size:10.5px;color:var(--ink-4);background:var(--surface-3);padding:2px 6px;border-radius:5px}
.tabs{display:flex;gap:2px;margin-left:6px}
.tab{padding:7px 13px;border-radius:8px;font-size:12.5px;color:var(--ink-3);font-weight:500;display:flex;align-items:center;gap:7px;transition:.12s;white-space:nowrap}
.tab:hover{background:var(--surface-2);color:var(--ink-2)}
.tab.on{background:var(--surface-3);color:var(--ink)}
.tab .tcode{font-family:var(--mono);font-size:9.5px;color:var(--ink-4)}
.tab.on .tcode{color:var(--sky)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:12px}
.inbox-pill{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:var(--r-pill);background:var(--surface-2);border:1px solid var(--border);font-size:12px;color:var(--ink-2);font-weight:500;transition:.12s}
.inbox-pill:hover{border-color:var(--sky-line);color:var(--ink)}
.inbox-pill .badge{font-family:var(--mono);font-size:10.5px;font-weight:600;background:var(--sky);color:#04121b;border-radius:99px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}
.me{display:flex;align-items:center;gap:9px;padding-left:12px;border-left:1px solid var(--border)}
.me .nm{font-size:12px;color:var(--ink-2);font-weight:500}
.me .rl{font-size:10px;color:var(--ink-4)}

/* page */
.page{flex:1;min-height:0;overflow:auto;padding:24px 26px 40px}
.page.desk{overflow:hidden;padding:0;display:flex;flex-direction:column}
.phead{display:flex;align-items:flex-end;gap:16px;margin-bottom:20px}
.phead h1{font-family:var(--disp);font-size:23px;font-weight:600;letter-spacing:0}
.phead .ph-sub{color:var(--ink-3);font-size:12.5px;padding-bottom:3px}
.phead .ph-r{margin-left:auto;display:flex;gap:9px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:var(--r-sm);font-size:12.5px;font-weight:500;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--border);transition:.12s;white-space:nowrap}
.btn:hover{background:var(--surface-3);border-color:var(--border-2);color:var(--ink)}
.btn.pri{background:var(--sky);color:#04121b;border-color:transparent;font-weight:600}
.btn.pri:hover{background:var(--sky-2);box-shadow:0 0 0 4px var(--sky-soft)}
.btn.pri:disabled{opacity:.5;box-shadow:none;cursor:not-allowed}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 9px;font-size:11.5px;gap:5px}
.ibtn{width:30px;height:30px;border-radius:var(--r-xs);display:grid;place-items:center;color:var(--ink-3);transition:.12s;background:transparent}
.ibtn:hover{background:var(--surface-3);color:var(--ink)}
.ibtn.sky:hover{color:var(--sky)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:var(--r-pill);font-size:11px;font-weight:500;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.chip .d{width:6px;height:6px;border-radius:99px;background:currentColor}
.chip.sky{background:var(--sky-soft);color:var(--sky)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.urgent{background:var(--urgent-soft);color:var(--urgent)}
.chip.advisor{background:var(--advisor-soft);color:var(--advisor)}
.chip.muted{background:var(--surface-3);color:var(--ink-4)}
.kmono{font-family:var(--mono);font-size:10px;color:var(--ink-4)}

/* avatar */
.av{flex:0 0 auto;border-radius:99px;display:grid;place-items:center;font-weight:600;font-family:var(--disp);color:#fff;font-size:12px;background:#3a3a44}
.av.lg{width:38px;height:38px;font-size:14px}
.av.md{width:30px;height:30px;font-size:12px}
.av.sm{width:22px;height:22px;font-size:10px}

/* seg */
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:2px;gap:2px}
.seg button{padding:5px 11px;border-radius:7px;font-size:11.5px;color:var(--ink-3);font-weight:500;transition:.1s;white-space:nowrap;display:flex;align-items:center;gap:5px}
.seg button:hover{color:var(--ink-2)}
.seg button.on{background:var(--surface-4);color:var(--ink)}
.seg button .cnt{font-family:var(--mono);font-size:9.5px;opacity:.7}

/* search */
.search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:7px 11px;color:var(--ink-3)}
.search:focus-within{border-color:var(--sky-line)}
.search input{background:none;border:none;outline:none;width:100%;font-size:12.5px;color:var(--ink)}
.search input::placeholder{color:var(--ink-4)}

/* desk */
.desk-tools{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:16px 24px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.desk-tools .dt-title{font-family:var(--disp);font-size:16px;font-weight:600;margin-right:4px}
.desk-tools .spacer{flex:1}
.desk-body{flex:1;min-height:0;display:grid;grid-template-columns:360px 1fr}
.desk-body.three{grid-template-columns:312px 1fr 284px}
.queue{border-right:1px solid var(--border);overflow:auto;background:var(--surface)}
.q-lane{position:sticky;top:0;z-index:1;background:linear-gradient(180deg,var(--surface),rgba(16,16,19,.85));backdrop-filter:blur(6px);padding:11px 16px 7px;display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:600;letter-spacing:.04em;color:var(--ink-4);text-transform:uppercase;border-bottom:1px solid var(--border)}
.q-lane .ln{flex:1}
.q-lane .qn{font-family:var(--mono);font-size:10px;color:var(--ink-4);text-transform:none;letter-spacing:0}
.qrow{display:flex;gap:11px;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:.1s;position:relative}
.qrow:hover{background:var(--surface-2)}
.qrow.on{background:var(--sky-deep)}
.qrow.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2.5px;background:var(--sky)}
.qrow .qmain{flex:1;min-width:0}
.qrow .qtop{display:flex;align-items:center;gap:7px;margin-bottom:3px}
.qrow .qttl{font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.qrow.unread .qttl{font-weight:600}
.qrow .qsub{font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .qmeta{display:flex;align-items:center;gap:7px;margin-top:7px;flex-wrap:wrap}
.qrow .qside{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.qrow .qtime{font-size:10.5px;color:var(--ink-4);font-family:var(--mono)}
.qrow .unread-dot{width:8px;height:8px;border-radius:99px;background:var(--sky);flex:0 0 auto}
.q-empty{padding:48px 24px;text-align:center;color:var(--ink-4);font-size:12.5px}
.q-arch-act{opacity:0;transition:.1s}
.qrow:hover .q-arch-act{opacity:1}

.focus{overflow:auto;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.f-empty{flex:1;display:grid;place-items:center;color:var(--ink-4);text-align:center}
.f-head{flex:0 0 auto;padding:18px 24px 14px;border-bottom:1px solid var(--border)}
.f-head .fh-top{display:flex;align-items:flex-start;gap:13px}
.f-head .fh-ttl{font-family:var(--disp);font-size:18px;font-weight:600;line-height:1.3;display:flex;align-items:center;gap:9px}
.f-head .fh-meta{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
.f-head .fh-act{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.on-dot{width:7px;height:7px;border-radius:99px;background:var(--ok);flex:0 0 auto}

/* M3 chat thread */
.thread{flex:1;padding:20px 24px;display:flex;flex-direction:column;gap:14px;min-height:0}
.t-day{align-self:center;font-size:10.5px;color:var(--ink-4);font-family:var(--mono);background:var(--surface-2);padding:3px 10px;border-radius:99px}
.msg{display:flex;gap:10px;max-width:78%}
.msg.user{align-self:flex-start}
.msg.agent{align-self:flex-end;flex-direction:row-reverse}
.msg.sys{align-self:center;max-width:90%}
.bubble{padding:10px 13px;border-radius:13px;font-size:13px;line-height:1.55}
.msg.user .bubble{background:var(--surface-3);border-top-left-radius:4px;color:var(--ink)}
.msg.agent .bubble{background:var(--sky-soft);border:1px solid var(--sky-line);border-top-right-radius:4px;color:var(--ink)}
.msg.sys .bubble{background:transparent;border:1px dashed var(--border-2);color:var(--ink-3);font-size:11.5px;text-align:center}
.msg .mwho{font-size:10.5px;color:var(--ink-4);margin-bottom:4px;display:flex;gap:6px;align-items:center}
.msg.agent .mwho{justify-content:flex-end}
.cta-row{margin-top:9px;display:flex;gap:7px;flex-wrap:wrap}
.cta{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:500;color:var(--ink-3);background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-pill);padding:3px 9px}
.cta .cta-tag{font-size:9px;color:var(--ink-5);font-family:var(--mono)}
.typing{align-self:flex-start;font-size:11px;color:var(--ink-4);display:flex;align-items:center;gap:7px;padding-left:32px}
.typing .dots{display:inline-flex;gap:3px}
.typing .dots i{width:5px;height:5px;border-radius:99px;background:var(--ink-4);animation:blink 1.2s infinite}
.typing .dots i:nth-child(2){animation-delay:.2s}.typing .dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}

.composer{flex:0 0 auto;border-top:1px solid var(--border);padding:13px 24px 16px;background:var(--surface)}
.quick-row{display:flex;gap:7px;margin-bottom:10px;flex-wrap:wrap}
.quick{font-size:11px;color:var(--ink-3);background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-pill);padding:4px 11px;transition:.1s;display:inline-flex;align-items:center;gap:5px}
.quick:hover{border-color:var(--sky-line);color:var(--sky)}
.comp-box{display:flex;gap:10px;align-items:flex-end;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);padding:9px 9px 9px 13px}
.comp-box:focus-within{border-color:var(--sky-line)}
.comp-box textarea{flex:1;background:none;border:none;outline:none;resize:none;font-size:13px;line-height:1.5;max-height:120px;color:var(--ink)}
.comp-box textarea::placeholder{color:var(--ink-4)}
.comp-hint{font-size:10px;color:var(--ink-5);margin-top:7px;font-family:var(--mono)}

/* M3 user rail */
.urail{border-left:1px solid var(--border);overflow:auto;background:var(--surface);padding:18px 16px;display:flex;flex-direction:column}
.ur-head{display:flex;gap:11px;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--border)}
.ur-nm{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.ur-on{font-size:10px;color:var(--ok);display:flex;align-items:center;gap:4px}
.ur-risk{display:flex;align-items:center;gap:7px;background:var(--warn-soft);color:var(--warn);border-radius:var(--r-sm);padding:8px 11px;font-size:11.5px;font-weight:500;margin-top:12px}
.ur-sec{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-4);margin:16px 0 4px}
.ur-kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;font-size:12px;color:var(--ink-3);border-bottom:1px solid var(--border)}
.ur-kv b{color:var(--ink);font-weight:500;text-align:right}
.ur-links{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.ur-link{display:flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:12px;color:var(--ink-2);background:var(--surface-2);transition:.1s;justify-content:flex-start}
.ur-link:hover{border-color:var(--sky-line);color:var(--sky)}
.ur-link .lcnt{margin-left:auto;font-family:var(--mono);font-size:11px}

/* M2 case view */
.casecol{overflow:auto;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.case-head{padding:18px 24px 16px;border-bottom:1px solid var(--border)}
.case-head .ch-row{display:flex;align-items:flex-start;gap:13px}
.case-head .fh-ttl{font-family:var(--disp);font-size:18px;font-weight:600;line-height:1.3;flex:1}
.case-head .fh-act{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.case-head .fh-meta{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
.pipe{display:flex;align-items:flex-start;margin-top:18px}
.pipe-s{display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;flex:0 0 auto;width:62px}
.pipe-line{flex:1;height:2px;background:var(--border);margin-top:13px;border-radius:2px;min-width:14px}
.pipe-line.done{background:var(--sky-line)}
.pipe-dot{width:28px;height:28px;border-radius:99px;border:2px solid var(--border-2);display:grid;place-items:center;font-size:11px;color:var(--ink-4);background:var(--surface-2);transition:.12s}
.pipe-s:hover .pipe-dot{border-color:var(--sky-line)}
.pipe-s.done .pipe-dot{border-color:var(--sky-line);color:var(--sky)}
.pipe-s.cur .pipe-dot{background:var(--sky);color:#04121b;border-color:transparent}
.pipe-lab{font-size:11px;color:var(--ink-4);white-space:nowrap}
.pipe-s.done .pipe-lab{color:var(--ink-2)}
.pipe-s.cur .pipe-lab{color:var(--ink);font-weight:600}
.case-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border-bottom:1px solid var(--border)}
.cm-cell{background:var(--surface);padding:13px 18px;display:flex;flex-direction:column;gap:6px}
.cm-cell .cm-k{font-size:10px;color:var(--ink-4);text-transform:uppercase;letter-spacing:.04em}
.cm-cell .cm-v{font-size:13px;color:var(--ink);font-weight:500;display:flex;align-items:center;gap:6px}
.cm-cell select.inp{padding:5px 8px;font-size:12.5px;border-radius:var(--r-xs)}
.sla-rem{font-family:var(--mono);font-size:12.5px}
.ustrip{display:flex;align-items:center;gap:12px;padding:13px 24px;border-bottom:1px solid var(--border);background:var(--surface-2)}
.us-main{flex:1;min-width:0}
.us-nm{font-size:13px;font-weight:600;margin-bottom:6px}
.us-tags{display:flex;gap:6px;flex-wrap:wrap}
.us-r{flex:0 0 auto;font-size:11px;color:var(--ink-4);font-family:var(--mono);text-align:right}
.sec-bar{padding:14px 24px 4px;font-size:11px;font-weight:600;color:var(--ink-3);display:flex;align-items:center;gap:8px}
.sec-bar .sb-n{font-family:var(--mono);font-size:10px;color:var(--ink-4)}
/* M2 timeline log */
.clog{padding:6px 24px 18px}
.clog-item{display:flex;gap:13px;padding:10px 0;position:relative}
.clog-item::before{content:"";position:absolute;left:5px;top:0;bottom:0;width:2px;background:var(--border)}

 const[list,setList]=useState(()=>TICKETS.map(t=>({...t,thread:[...t.thread]})));
 const[seg,setSeg]=useState("active");const[q,setQ]=useState("");
 const[sel,setSel]=useState(list[0].id);const[esc,setEsc]=useState(null);
 const counts=useMemo(()=>({active:list.filter(t=>!t.arch&&t.status!=="closed").length,closed:list.filter(t=>!t.arch&&t.status==="closed").length,archived:list.filter(t=>t.arch).length}),[list]);
 const segs=[{id:"active",label:"进行中",cnt:counts.active},{id:"closed",label:"已关闭",cnt:counts.closed},{id:"archived",label:"已归档",cnt:counts.archived}];
 const view=useMemo(()=>list.filter(t=>{if(seg==="archived")return t.arch;if(t.arch)return false;if(seg==="closed")return t.status==="closed";return t.status!=="closed"}).filter(t=>!q||t.subj.includes(q)||t.id.toLowerCase().includes(q.toLowerCase())||t.user.includes(q)||(CATS[t.cat]||"").includes(q)||t.thread.some(m=>m.who!=="sys"&&m.body.includes(q))),[list,seg,q]);

 useEffect(()=>{if(view.length&&!view.some(t=>t.id===sel))setSel(view[0].id)},[seg]);
 const arch=t=>t.status==="resolved"||t.status==="closed";
 const sysApp=(id,b,ex={})=>setList(l=>l.map(t=>t.id===id?{...t,...ex,thread:[...t.thread,{who:"sys",body:b}]}:t));
 const doArch=(id,on)=>{sysApp(id,on?"工单已归档 · 移入「已归档」类别(可查询/可还原)":"已从归档还原 · 回到活跃队列",{arch:on});push(on?"已归档 · 可查回":"已还原")};

 const setStatus=(id,st)=>{sysApp(id,`状态改为「${TK_STATUS[st][1]}」· 例行操作自动留档`,{status:st,rem:st==="resolved"?"已解决":st==="closed"?"已关闭":st==="pending_user"?"等待用户":"处理中"});push("状态已更新 · 自动留档")};
 const setOwner=(id,o)=>{sysApp(id,`负责人改派给 @${o} · 例行操作自动留档`,{owner:o});push("负责人已更新 · 自动留档")};
 const setPri=(id,p)=>{sysApp(id,`优先级改为「${PRI[p][1]}」· 例行操作自动留档`,{pri:p});push("优先级已更新 · 自动留档")};
 const sla=showCur&&(SLA.find(s=>s.cat===showCur.cat)||{});
 return <div className="page desk">
  <DeskTools title="工单台" sub="异步案件 · 状态流水线驱动" segs={segs} seg={seg} setSeg={setSeg} q={q} setQ={setQ}/>
  <div className="desk-body">
   <div className="queue">
    <div className="q-lane"><span className="ln">{segs.find(s=>s.id===seg).label}</span><span className="qn">{view.length} 单</span></div>
    {view.length===0&&<div className="q-empty">该类别暂无工单</div>}
    {view.map(t=><div key={t.id} className={cls("qrow",showCur&&showCur.id===t.id&&"on")} onClick={()=>setSel(t.id)}>
      <Av name={t.user} size="md"/>
      <div className="qmain">
        <div className="qtop"><span className="qttl">{t.subj}</span></div>
        <div className="qsub"><span className="mono" style={{fontSize:10.5}}>{t.id}</span> · {CATS[t.cat]} · {t.user}</div>
        <div className="qmeta"><StatChip status={t.status} map={TK_STATUS}/><PriChip pri={t.pri}/><span className={cls("chip",t.rem.includes("剩")&&parseInt(t.rem.replace(/\D/g,""))<=12?"warn":"muted")}><Ic d="clock" s={10}/>{t.rem}</span></div>
      </div>
      <div className="qside">
        <span className="qtime">{t.last}</span>
        {arch(t)&&seg!=="archived"&&<button className="ibtn sky q-arch-act" title="一键归档" onClick={e=>{e.stopPropagation();doArch(t.id,true)}}><Ic d="archive" s={15}/></button>}
        {seg==="archived"&&<button className="ibtn sky q-arch-act" title="还原" onClick={e=>{e.stopPropagation();doArch(t.id,false)}}><Ic d="up" s={15}/></button>}
      </div>
    </div>)}
   </div>
   {showCur?<div className="casecol">

     <div className="fh-meta"><span className="kmono">{showCur.id}</span><span className="chip muted">{CATS[showCur.cat]}</span></div>
     {!showCur.arch&&<StatusPipe status={showCur.status} onSet={st=>{if(st!==showCur.status)setStatus(showCur.id,st)}}/>}
    </div>

     <div className="cm-cell"><span className="cm-k">负责人</span>{showCur.arch?<span className="cm-v">@{showCur.owner}</span>:<select className="inp" value={showCur.owner} onChange={e=>setOwner(showCur.id,e.target.value)}>{SEAT_NAMES.map(n=><option key={n} value={n}>{n}</option>)}</select>}</div>
     <div className="cm-cell"><span className="cm-k">优先级</span>{showCur.arch?<span className="cm-v"><PriChip pri={showCur.pri}/></span>:<select className="inp" value={showCur.pri} onChange={e=>setPri(showCur.id,e.target.value)}>{Object.keys(PRI).map(k=><option key={k} value={k}>{PRI[k][1]}</option>)}</select>}</div>

   </div>:<div className="casecol"><div className="f-empty"><div><Ic d="ticket" s={28}/><div style={{marginTop:10}}>选择左侧工单查看案件</div></div></div></div>}
  </div>
  <ConfirmModal open={!!esc} onClose={()=>setEsc(null)} title="升级为即时会话" sub="跨载体处置 · 需确认 + 理由" icon="up" tone="sky" confirmLabel="升级并新建会话"
    onConfirm={()=>{if(esc)sysApp(esc.id,"已升级为即时会话 cv-esc · 已关联本工单 · 写入审计",{status:"resolved",rem:"已解决"});push("已升级 · 新建即时会话并关联本工单")}}/>

/* ============ M3 即时会话台 = 实时收件箱(三栏) ============ */
const SESS_STATUS={open:["sky","进行中"],resolved:["ok","已解决"]};
function M3Sessions({push,lastConvo,setLastConvo}){
 const[list,setList]=useState(()=>SESSIONS.map(s=>({...s,thread:[...s.thread]})));
 const[seg,setSeg]=useState("active");const[q,setQ]=useState("");
 const[sel,setSel]=useState(lastConvo||"cv-2042");
 const[initiate,setInitiate]=useState(false);const[toTk,setToTk]=useState(null);
 const counts=useMemo(()=>({active:list.filter(s=>!s.arch&&s.status==="open").length,resolved:list.filter(s=>!s.arch&&s.status==="resolved").length,archived:list.filter(s=>s.arch).length}),[list]);
 const segs=[{id:"active",label:"进行中",cnt:counts.active},{id:"resolved",label:"已解决",cnt:counts.resolved},{id:"archived",label:"已归档",cnt:counts.archived}];
 const view=useMemo(()=>list.filter(s=>{if(seg==="archived")return s.arch;if(s.arch)return false;if(seg==="resolved")return s.status==="resolved";return s.status==="open"}).filter(s=>!q||s.user.includes(q)||s.id.includes(q)||s.thread.some(m=>m.who!=="sys"&&m.body.includes(q))),[list,seg,q]);
 const cur=list.find(s=>s.id===sel);const showCur=cur&&view.some(s=>s.id===sel)?cur:view[0];
 const choose=id=>{setSel(id);setLastConvo&&setLastConvo(id)};
 useEffect(()=>{if(view.length&&!view.some(s=>s.id===sel))setSel(view[0].id)},[seg]);
 const arch=s=>s.status==="resolved";
 const sysApp=(id,b,ex={})=>setList(l=>l.map(s=>s.id===id?{...s,...ex,thread:[...s.thread,{who:"sys",body:b}]}:s));
 const doArch=(id,on)=>{sysApp(id,on?"会话已归档 · 移入「已归档」类别(可查询/可还原)":"已从归档还原",{arch:on});push(on?"会话已归档 · 可查回":"已还原")};
 const reply=(id,b)=>{setList(l=>l.map(s=>s.id===id?{...s,unread:0,thread:[...s.thread,{who:"agent",name:s.identity,t:"现在",body:b}],last:"刚刚"}:s));push("回复已发送 · 自动留档")};
 const resolve=id=>{sysApp(id,"会话已解决 · 例行操作自动留档",{status:"resolved",wait:"已解决"});push("会话已解决 · 自动留档")};
 const toTicket=id=>{const tk="TK-"+(1030+Math.round(performance.now()%900));sysApp(id,`已转为工单 ${tk} · 本会话置为已解决 · 写入审计`,{status:"resolved",wait:"已解决"});push("已转为工单 · 已关联并留档")};
 const addInit=o=>{const nid="cv-"+Math.round(2050+performance.now()%900);
   const aMsg={who:"agent",name:o.identity,t:"现在",body:o.script.body};
   if(o.script.cta&&o.script.cta!=="—")aMsg.cta={label:o.script.cta.replace("→ ",""),to:o.script.cta.includes("商城")?"商城":"锁仓"};
   const newS={id:nid,user:o.targetLabel,type:o.idType,unread:0,status:"open",last:"刚刚",wait:"主动触达",owner:ME,identity:o.identity,
     thread:[{who:"sys",body:`坐席 ${ME} 以${o.idType==="advisor"?"顾问":"客服"}身份「${o.identity}」主动发起 · 目标：${o.targetDesc}${o.reason?` · 理由：${o.reason}`:""}`},aMsg]};
   setList(l=>[newS,...l]);setSeg("active");choose(nid);push("已发起会话 · 已入进行中队列");
 };
 const u=showCur&&(USER_DB[showCur.user]||{});
 return <div className="page desk">
  <DeskTools title="即时会话台" sub="实时接待 · 服务端会话永不挂断,切页可续" segs={segs} seg={seg} setSeg={setSeg} q={q} setQ={setQ}
    right={<button className="btn pri" onClick={()=>setInitiate(true)}><Ic d="plus" s={14}/>主动发起会话</button>}/>
  <div className="desk-body three">
   <div className="queue">
    <div className="q-lane"><span className="ln">{segs.find(s=>s.id===seg).label}</span><span className="qn">{view.length} 个</span></div>
    {view.length===0&&<div className="q-empty">该类别暂无会话</div>}
    {view.map(s=><div key={s.id} className={cls("qrow",s.unread&&"unread",showCur&&showCur.id===s.id&&"on")} onClick={()=>choose(s.id)}>
      <Av name={s.user} size="md"/>
      <div className="qmain">
        <div className="qtop"><span className="qttl">{s.user}</span><span className={cls("chip",SESS_TYPE[s.type][0])}>{SESS_TYPE[s.type][1]}</span></div>
        <div className="qsub">{(s.thread.filter(m=>m.who!=="sys").slice(-1)[0]||{}).body||"主动触达 · 等待用户回应"}</div>
        <div className="qmeta"><StatChip status={s.status} map={SESS_STATUS}/><span className={cls("chip",s.wait.includes("等待")?"warn":"muted")}><Ic d="clock" s={10}/>{s.wait}</span></div>
      </div>
      <div className="qside">
        {s.unread>0&&<span className="unread-dot"/>}
        <span className="qtime">{s.last}</span>
        {arch(s)&&seg!=="archived"&&<button className="ibtn sky q-arch-act" title="一键归档" onClick={e=>{e.stopPropagation();doArch(s.id,true)}}><Ic d="archive" s={15}/></button>}
        {seg==="archived"&&<button className="ibtn sky q-arch-act" title="还原" onClick={e=>{e.stopPropagation();doArch(s.id,false)}}><Ic d="up" s={15}/></button>}
      </div>
    </div>)}
   </div>
   {showCur?<div className="focus">
     <div className="f-head"><div className="fh-top">
       <div style={{flex:1,minWidth:0}}>
         <div className="fh-ttl">{showCur.user}{u.online&&<span className="ur-on"><span className="on-dot"/>在线</span>}</div>
         <div className="fh-meta"><span className={cls("chip",SESS_TYPE[showCur.type][0])}>{SESS_TYPE[showCur.type][1]}</span><StatChip status={showCur.status} map={SESS_STATUS}/><span className="kmono">{showCur.id}</span><span className="chip muted">对外身份 {showCur.identity}</span></div>
       </div>
       <div className="fh-act">
         {!showCur.arch&&<>
           {showCur.status==="open"&&<button className="btn sm" onClick={()=>resolve(showCur.id)}><Ic d="check" s={13}/>标记已解决</button>}
           {showCur.status==="open"&&<button className="btn sm" onClick={()=>setToTk(showCur)}><Ic d="ticket" s={13}/>转工单</button>}
           {arch(showCur)&&<button className="btn sm" onClick={()=>doArch(showCur.id,true)}><Ic d="archive" s={13}/>归档</button>}
         </>}
         {showCur.arch&&<button className="btn sm" onClick={()=>doArch(showCur.id,false)}><Ic d="up" s={13}/>还原</button>}
       </div>
     </div></div>
     <Thread msgs={showCur.thread} typing={showCur.status==="open"&&u.online}/>
     {!showCur.arch&&showCur.status==="open"
       ?<Composer templates={TEMPLATES} onSend={b=>reply(showCur.id,b)} placeholder={`以「${showCur.identity}」身份回复…`}/>
       :<div className="composer" style={{color:"var(--ink-4)",fontSize:12,textAlign:"center"}}>{showCur.arch?"已归档会话为只读 · 可还原后继续":"会话已解决 · 如用户再来将自动重开"}</div>}
   </div>:<div className="focus"><div className="f-empty"><div><Ic d="chat" s={28}/><div style={{marginTop:10}}>选择左侧会话开始接待</div></div></div></div>}
   {showCur?<UserRail name={showCur.user}/>:<div className="urail"/>}
  </div>
  {initiate&&<InitiateModal onClose={()=>setInitiate(false)} onSend={o=>{addInit(o);setInitiate(false)}}/>}
  <ConfirmModal open={!!toTk} onClose={()=>setToTk(null)} title="转为工单" sub="跨载体处置 · 需确认 + 理由" icon="ticket" tone="sky" confirmLabel="转工单并关联"
    onConfirm={()=>{if(toTk)toTicket(toTk.id);setToTk(null)}}/>
 </div>;
}

/* 主动发起会话(客服身份 + 单人/人群 + 服务话术 + 人群理由) */
function InitiateModal({onClose,onSend}){
 const MY=SEATS.find(s=>s.name===ME).identities.filter(i=>i.on);
 const[step,setStep]=useState(0);
 const[identity,setIdentity]=useState(MY[0]);
 const[mode,setMode]=useState("single");
 const[user,setUser]=useState(null);const[uq,setUq]=useState("");
 const[aud,setAud]=useState(AUDIENCES[0]);const[audVal,setAudVal]=useState(null);const[conds,setConds]=useState([]);
 const[script,setScript]=useState(SCRIPTS.find(s=>s.status==="published"));
 const[reason,setReason]=useState("");
 useEsc(true,onClose);
 const pub=SCRIPTS.filter(s=>s.status==="published");
 const uv=Object.entries(USER_DB).filter(([n])=>!uq||n.includes(uq)).filter(([,d])=>!uq||true).concat();
 const userList=Object.keys(USER_DB).filter(n=>!uq||n.includes(uq)||USER_DB[n].id.includes(uq));
 const vals=AUD_VALUES[aud.id];
 const tOk=mode==="single"?!!user:(aud.id==="all"?true:aud.id==="custom"?segValid(conds):!!audVal);
 const canNext=step===0?!!identity:step===1?tOk:!!script;
 const needReason=mode==="audience";
 const canFinish=canNext&&(!needReason||reason.trim());
 const labels=["选择身份","选择目标","服务话术"+(needReason?" + 理由":"")];
 const finish=()=>onSend({identity:identity.label,idType:identity.type,
   targetLabel:mode==="single"?user:(aud.id==="custom"?"自定义人群":(aud.label+(audVal?` · ${audVal}`:""))),
   targetDesc:mode==="single"?`单个用户 ${user}（${USER_DB[user].id}）`:(aud.id==="custom"?`自定义人群 · ${segSummary(conds)}`:`人群 · ${aud.label}${audVal?` = ${audVal}`:""}`),
   script,reason:needReason?reason.trim():""});
 return <div className="scrim" onClick={onClose}><div className="modal wide" onClick={e=>e.stopPropagation()}>
  <div className="m-head"><div className="m-ic" style={{background:"var(--sky-soft)",color:"var(--sky)"}}><Ic d="plus" s={18}/></div><div style={{flex:1}}><h3>主动发起会话</h3><div className="m-sub">坐席主动向用户发起即时会话 · 客服身份走服务、顾问身份可带转化</div></div></div>
  <div className="m-body">
   <div className="steps">{labels.map((_,i)=><div key={i} className={cls("step",i<=step&&"done")}/>)}</div>
   <div className="step-lab">{labels.map((l,i)=><span key={i} className={cls(i===step&&"on")}>{i+1}. {l}</span>)}</div>
   {step===0&&<div>
     <div className="fld" style={{marginBottom:8}}><label>以哪个身份发出？</label><span className="hint">坐席可挂 客服 / 顾问 多个身份,本次会话以所选身份对用户呈现</span></div>
     <div className="opt-grid">{MY.map(id=><div key={id.id} className={cls("opt",identity.id===id.id&&"on")} onClick={()=>setIdentity(id)}><span className="o-rd"/><Av name={id.label} size="md"/><div className="o-main"><div className="o-ttl">{id.label}{id.type==="advisor"?<span className="chip advisor">顾问身份</span>:<span className="chip muted">客服身份</span>}</div><div className="o-sub mono">{id.id}</div></div></div>)}</div>
   </div>}
   {step===1&&<div>
     <div className="seg" style={{marginBottom:14}}><button className={cls(mode==="single"&&"on")} onClick={()=>setMode("single")}><Ic d="user" s={13}/> 单个用户</button><button className={cls(mode==="audience"&&"on")} onClick={()=>setMode("audience")}><Ic d="users" s={13}/> 圈定人群</button></div>
     {mode==="single"?<div>
       <div className="search" style={{marginBottom:8}}><Ic d="search" s={14}/><input autoFocus value={uq} placeholder="按用户名 / 用户 ID 检索某个人…" onChange={e=>setUq(e.target.value)}/></div>
       <div className="usr-res">{userList.map(n=>{const d=USER_DB[n];return <div key={n} className={cls("ur",user===n&&"on")} onClick={()=>setUser(n)}><Av name={n} size="sm"/><div style={{flex:1,minWidth:0}}><div style={{fontSize:12.5,fontWeight:500}}>{n} <span className="kmono">{d.id}</span></div><div style={{fontSize:11,color:"var(--ink-3)"}}>{d.region} · KYC {d.kyc} · {d.hold}</div></div>{user===n&&<Ic d="check" s={15} c="var(--sky)"/>}</div>})}
        {userList.length===0&&<div style={{padding:18,textAlign:"center",color:"var(--ink-4)",fontSize:12}}>无匹配用户</div>}</div>
     </div>:<div>
       <div className="fld" style={{marginBottom:8}}><span className="hint">选维度后再选具体值,或用「自定义圈选」多条件「且」组合(V 等级 / 余额 / 提现 / 持仓 / 注册天数 …)</span></div>
       <div className="opt-grid">{AUDIENCES.map(a=><div key={a.id} className={cls("opt",aud.id===a.id&&"on")} onClick={()=>{setAud(a);setAudVal(null)}}><span className="o-rd"/><div className="o-main"><div className="o-ttl">{a.label}</div><div className="o-sub">{a.sub}</div></div></div>)}</div>
       {vals&&<div className="val-row">{vals.map(v=><button key={v} className={cls("val-chip",audVal===v&&"on")} onClick={()=>setAudVal(v)}>{v}</button>)}</div>}
       {aud.id==="custom"&&<div style={{marginTop:12}}><CustomSegment conds={conds} setConds={setConds}/></div>}
     </div>}
   </div>}
   {step===2&&<div>
     <div className="fld" style={{marginBottom:8}}><label>选一条已发布的开场话术</label><span className="hint">将作为会话第一条消息发出{identity.type==="advisor"?" · 顾问话术可带 →商城/→锁仓 跳转标记":" · 客服走服务性话术"}</span></div>
     <div className="opt-grid">{pub.map(s=><div key={s.id} className={cls("opt",script&&script.id===s.id&&"on")} onClick={()=>setScript(s)}><span className="o-rd"/><div className="o-main"><div className="o-ttl">{s.title} <span className="kmono">{s.id}</span>{s.cta&&s.cta!=="—"&&<span className="chip muted">{s.cta}</span>}</div><div className="o-sub">{s.body}</div></div></div>)}</div>
     {needReason&&<div className="fld" style={{marginTop:16,marginBottom:0}}><label>触达理由 <span style={{color:"var(--bad)"}}>*</span> <span className="hint">（人群批量触达属高敏 · 写入审计）</span></label><textarea className="inp" value={reason} placeholder="简述本次人群触达的业务理由…" onChange={e=>setReason(e.target.value)}/></div>}
   </div>}
  </div>
  <div className="m-foot"><div className="lft"><Ic d="shield" s={13}/>发起将写入审计 · 身份 / 目标 / 话术{needReason?" / 理由":""}留档</div>
   {step>0&&<button className="btn ghost" onClick={()=>setStep(step-1)}>上一步</button>}
   {step<2?<button className="btn pri" disabled={!canNext} onClick={()=>setStep(step+1)}>下一步</button>:<button className="btn pri" disabled={!canFinish} onClick={finish}><Ic d="send" s={14}/>发起会话</button>}
  </div>
 </div></div>;
}

/* ============ M1 客服总览 ============ */

 const pendUser=TICKETS.filter(t=>t.status==="pending_user").length;
 const openSess=SESSIONS.filter(s=>s.status==="open").length;
 const waitReply=SESSIONS.filter(s=>s.status==="open"&&(s.thread.filter(m=>m.who!=="sys").slice(-1)[0]||{}).who==="user").length;

  {lab:"进行中工单",val:openTk,ic:"ticket",foot:"派生自工单台 · 点击进台",c:"var(--sky)",to:"M2"},

 const maxLoad=Math.max(1,...SEATS.map(s=>loadOf(s.name)));
 return <div className="page">

  </div>

   {stats.map(s=><div className={cls("card",s.to&&"click")} key={s.lab} onClick={s.to?()=>go(s.to):undefined} style={{borderColor:(s.urgent&&s.val>0)?"var(--urgent-line)":undefined}}><div className="stat">
     <span className="s-ic"><Ic d={s.ic} s={18}/></span><span className="s-lab">{s.lab}</span><span className="s-val tnum" style={{color:s.c}}>{s.val}</span><span className="s-foot">{s.to&&<Ic d="arrow" s={11}/>}{s.foot}</span>
   </div></div>)}
  </div>
  <div className="grid" style={{gridTemplateColumns:"1.45fr 1fr"}}>
   <div className="card">
    <div className="card-h"><Ic d="clock" s={15} c="var(--ink-3)"/><h3>分类 SLA 监控</h3><span className="ch-sub">首响 / 解决目标 · 在办量 · 超时风险</span></div>
    <div className="card-b flush"><table className="tbl"><thead><tr><th>分类</th><th>首响 / 解决</th><th>负责队列</th><th>在办</th><th>健康</th></tr></thead>
     <tbody>{SLA.map(s=>{const r=s.risk>0;const w=r?"84%":(s.open>0?"42%":"10%");return <tr key={s.cat}><td><span style={{fontWeight:500,color:"var(--ink)"}}>{CATS[s.cat]}</span> <span className="kmono">{s.cat}</span></td><td className="mono" style={{fontSize:11.5}}>{s.first}m / {s.resolve}h</td><td>{s.queue}</td><td className="tnum">{s.open}</td><td><div style={{display:"flex",alignItems:"center",gap:9}}><div className="meter"><span style={{width:w,background:r?"var(--warn)":"var(--ok)"}}/></div>{r?<span className="chip warn">1 单近超时</span>:<span className="chip ok">达成</span>}</div></td></tr>})}</tbody></table></div>
   </div>
   <div className="card">
    <div className="card-h"><Ic d="users" s={15} c="var(--ink-3)"/><h3>坐席负载</h3><span className="ch-sub">派生自在办工单 + 会话 · 非真在线态</span></div>
    <div className="card-b flush">{SEATS.map(s=>{const l=loadOf(s.name);const lv=l>=2?"忙":l===1?"接待中":"空闲";const lc=l>=2?"var(--warn)":l===1?"var(--sky)":"var(--ok)";return <div className="seat" key={s.name}><Av name={s.name} size="sm"/><span className="s-nm">{s.name}</span><div className="s-bar"><span style={{width:Math.max(6,l/maxLoad*100)+"%",background:lc}}/></div><span className="s-load">{l} 件 · {lv}</span></div>})}</div>
   </div>
  </div>
 </div>;
}

/* ============ M4 知识库与 SLA ============ */
const FAQS=[
 {id:"FAQ-01",q:"提现一般多久到账？",cat:"Withdrawal",status:"published"},
 {id:"FAQ-02",q:"KYC 被拒后如何重新提交？",cat:"KYC",status:"published"},
 {id:"FAQ-03",q:"NexionBox 固件如何回滚？",cat:"Hardware",status:"draft"},
 {id:"FAQ-04",q:"创世节点收益什么时候发放？",cat:"Genesis",status:"published"},
];
function M4KbSla({push}){
 const[sla,setSla]=useState(SLA);const[faqs,setFaqs]=useState(FAQS);const[editSla,setEditSla]=useState(null);
 return <div className="page">
  <div className="phead"><h1>知识库与 SLA</h1><span className="ph-sub">配置面 · 维护 FAQ 内容 + 工单分类 SLA 矩阵</span></div>
  <div className="grid" style={{gridTemplateColumns:"1fr 1.25fr"}}>
   <div className="card">
    <div className="card-h"><Ic d="book" s={15} c="var(--ink-3)"/><h3>Help / FAQ</h3><div className="ch-r"><button className="btn sm" onClick={()=>push("新增 FAQ 草稿(原型)")}><Ic d="plus" s={13}/>新增</button></div></div>
    <div className="card-b flush">{faqs.map(f=><div className="lrow" key={f.id}><div className="lr-main"><div className="lr-ttl">{f.q}</div><div className="lr-sub"><span className="kmono">{f.id}</span> · {CATS[f.cat]}</div></div><div className="lr-r"><span className={cls("chip",f.status==="published"?"ok":"muted")}>{f.status==="published"?"已发布":"草稿"}</span><button className="ibtn" title="编辑" onClick={()=>push("编辑 FAQ（原型）")}><Ic d="edit" s={15}/></button>{f.status!=="published"&&<button className="btn sm pri" onClick={()=>{setFaqs(x=>x.map(y=>y.id===f.id?{...y,status:"published"}:y));push("FAQ 已发布")}}>发布</button>}</div></div>)}</div>
   </div>
   <div className="card">
    <div className="card-h"><Ic d="clock" s={15} c="var(--ink-3)"/><h3>SLA 矩阵</h3><span className="ch-sub">每分类的首响 / 解决目标 · 队列 · 升级路径 · 数值可编辑</span></div>
    <div className="card-b flush"><table className="tbl"><thead><tr><th>分类</th><th>首响目标</th><th>解决目标</th><th>负责队列</th><th>升级路径</th></tr></thead>
     <tbody>{sla.map(s=><tr key={s.cat}><td><span style={{fontWeight:500,color:"var(--ink)"}}>{CATS[s.cat]}</span></td><td><span className="editable" onClick={()=>setEditSla({...s,field:"first"})}>{s.first}m<Ic d="edit" s={11} c="var(--ink-4)"/></span></td><td><span className="editable" onClick={()=>setEditSla({...s,field:"resolve"})}>{s.resolve}h<Ic d="edit" s={11} c="var(--ink-4)"/></span></td><td>{s.queue}</td><td className="kmono" style={{fontSize:11}}>↗ {s.esc}</td></tr>)}</tbody></table></div>
   </div>
  </div>
  <ConfirmModal open={!!editSla} onClose={()=>setEditSla(null)} title="调整 SLA 目标" sub="高敏配置 · 需确认 + 理由" icon="clock" tone="warn"
    edit={editSla&&{kind:`${CATS[editSla.cat]} · ${editSla.field==="first"?"首响目标":"解决目标"}`,current:editSla.field==="first"?editSla.first+"m":editSla.resolve+"h",input:true,unit:editSla.field==="first"?"分钟":"小时",inputInit:editSla.field==="first"?editSla.first:editSla.resolve}}
    onConfirm={(r,nv)=>{const n=parseInt(nv,10);if(!isNaN(n)&&n>0)setSla(x=>x.map(y=>y.cat===editSla.cat?{...y,[editSla.field]:n}:y));push("SLA 目标已更新")}}/>
 </div>;
}

/* ============ M5 话术与模板配置(顾问 = 人工客服身份分类,顾问转化在此) ============ */
function M5Scripts({push}){
 const[cats,setCats]=useState(CATEGORIES);
 const[policy,setPolicy]=useState({on:true,delay:1500,cooldown:24,cap:1,audience:"全量用户"});
 const[scripts,setScripts]=useState(SCRIPTS);
 const[tpls]=useState(TEMPLATES);
 const[seats,setSeats]=useState(SEATS);
 const[gate,setGate]=useState(null);
 const[edit,setEdit]=useState(null);
 const[editAud,setEditAud]=useState(false);
 const toggleCat=c=>{if(c.locked)return;
   if(c.on)setGate({title:`停用类别「${c.label}」`,sub:"关停整条接待通道 · 高敏 · 需确认+理由",tone:"bad",edit:{kind:"会话类别",current:"启用",next:"停用"},run:()=>{setCats(x=>x.map(y=>y.id===c.id?{...y,on:false}:y));push(`类别「${c.label}」已停用`)}});
   else{setCats(x=>x.map(y=>y.id===c.id?{...y,on:true}:y));push(`类别「${c.label}」已启用`)}};
 const togglePush=()=>{
   if(policy.on)setGate({title:"关闭主动推送总开关",sub:"关闭后顾问全域不再主动发起 · 高敏 · 需确认+理由",tone:"bad",edit:{kind:"主动推送总开关",current:"ON",next:"OFF"},run:()=>{setPolicy(p=>({...p,on:false}));push("主动推送已关闭")}});
   else{setPolicy(p=>({...p,on:true}));push("主动推送已开启")}};
 const toggleId=(sn,id)=>{
   if(id.on)setGate({title:`停用身份「${id.label}」`,sub:"停用后 M3 发起会话不再可选此身份 · 高敏 · 需确认+理由",tone:"bad",edit:{kind:"身份启用态",current:"启用",next:"停用"},run:()=>{setSeats(xs=>xs.map(x=>x.name===sn?{...x,identities:x.identities.map(i=>i.id===id.id?{...i,on:false}:i)}:x));push(`身份「${id.label}」已停用`)}});
   else{setSeats(xs=>xs.map(x=>x.name===sn?{...x,identities:x.identities.map(i=>i.id===id.id?{...i,on:true}:i)}:x));push(`身份「${id.label}」已启用`)}};
 return <div className="page">
  <div className="phead"><h1>话术与模板配置</h1><span className="ph-sub">配置面 · 会话类别 / 顾问主动推送 / 话术 / 模板 / 坐席身份</span></div>
  <div className="grid" style={{gridTemplateColumns:"1fr 1fr"}}>
   <div className="card">
    <div className="card-h"><Ic d="chat" s={15} c="var(--ink-3)"/><h3>会话类别</h3><span className="ch-sub">含 专属顾问 / 普通客服 / Nova AI · 启停=高敏</span></div>
    <div className="card-b flush">{cats.map(c=><div className="lrow" key={c.id}><div className="lr-main"><div className="lr-ttl">{c.label}{c.locked&&<span className="chip muted"><Ic d="lock" s={10}/>{c.owner}</span>}</div><div className="lr-sub">{c.sub}</div></div><div className={cls("tg",c.on&&"on",c.locked&&"lock")} onClick={()=>toggleCat(c)}/></div>)}</div>
   </div>
   <div className="card">
    <div className="card-h"><Ic d="sliders" s={15} c="var(--ink-3)"/><h3>顾问主动推送策略</h3><span className="ch-sub">高敏 · 调参/总开关带确认+理由</span></div>
    <div className="card-b flush">
     <div className="lrow"><div className="lr-main"><div className="lr-ttl">主动推送总开关</div><div className="lr-sub">关闭后顾问不再主动发起</div></div><div className={cls("tg",policy.on&&"on")} onClick={togglePush}/></div>
     <div className="lrow"><div className="lr-main"><div className="lr-ttl">首推延迟</div><div className="lr-sub">用户进入后多久首次推送</div></div><span className="editable" onClick={()=>setEdit({key:"delay",kind:"首推延迟",current:policy.delay+"ms",unit:"ms",inputInit:policy.delay})}>{policy.delay}ms<Ic d="edit" s={11} c="var(--ink-4)"/></span></div>
     <div className="lrow"><div className="lr-main"><div className="lr-ttl">冷却时间</div><div className="lr-sub">同一用户两次推送间隔</div></div><span className="editable" onClick={()=>setEdit({key:"cooldown",kind:"冷却时间",current:policy.cooldown+"h",unit:"小时",inputInit:policy.cooldown})}>{policy.cooldown}h<Ic d="edit" s={11} c="var(--ink-4)"/></span></div>
     <div className="lrow"><div className="lr-main"><div className="lr-ttl">单会话上限</div><div className="lr-sub">一段会话最多主动推送条数</div></div><span className="editable" onClick={()=>setEdit({key:"cap",kind:"单会话上限",current:policy.cap+" 条",unit:"条",inputInit:policy.cap})}>{policy.cap} 条<Ic d="edit" s={11} c="var(--ink-4)"/></span></div>
     <div className="lrow"><div className="lr-main"><div className="lr-ttl">受众圈定</div><div className="lr-sub">主动推送投放的人群范围</div></div><span className="editable" onClick={()=>setEditAud(true)}><Ic d="users" s={12} c="var(--ink-4)"/>{policy.audience}<Ic d="edit" s={11} c="var(--ink-4)"/></span></div>
    </div>
   </div>
   <div className="card">
    <div className="card-h"><Ic d="bolt" s={15} c="var(--ink-3)"/><h3>顾问主动话术库</h3><span className="ch-sub">主动发起开场话术 · 顾问类可带 →商城/→锁仓 跳转(正文守铁律不写自曝数字)</span><div className="ch-r"><button className="btn sm" onClick={()=>push("新增话术草稿(原型)")}><Ic d="plus" s={13}/>新增</button></div></div>
    <div className="card-b flush">{scripts.map(s=><div className="lrow" key={s.id}><div className="lr-main"><div className="lr-ttl">{s.title}{s.cta&&s.cta!=="—"&&<span className="chip muted">{s.cta}</span>}</div><div className="lr-sub"><span className="kmono">{s.id}</span> · 受众 {s.aud} · {s.body.slice(0,16)}…</div></div><div className="lr-r"><span className={cls("chip",s.status==="published"?"ok":"muted")}>{s.status==="published"?"已发布":"草稿"}</span>{s.status!=="published"?<button className="btn sm pri" onClick={()=>{setScripts(x=>x.map(y=>y.id===s.id?{...y,status:"published"}:y));push("话术已发布")}}>发布</button>:<button className="btn sm" onClick={()=>{setScripts(x=>x.map(y=>y.id===s.id?{...y,status:"draft"}:y));push("话术已归档为草稿")}}>归档</button>}</div></div>)}</div>
   </div>
   <div className="card">
    <div className="card-h"><Ic d="reply" s={15} c="var(--ink-3)"/><h3>即时回复模板库</h3><div className="ch-r"><button className="btn sm" onClick={()=>push("新增模板草稿(原型)")}><Ic d="plus" s={13}/>新增</button></div></div>
    <div className="card-b flush">{tpls.map(t=><div className="lrow" key={t.id}><div className="lr-main"><div className="lr-ttl">{t.title}</div><div className="lr-sub"><span className="kmono">{t.id}</span> · {t.body.slice(0,24)}…</div></div><div className="lr-r"><span className="chip ok">已发布</span><button className="ibtn" title="编辑" onClick={()=>push("编辑模板（原型）")}><Ic d="edit" s={15}/></button></div></div>)}</div>
   </div>
   <div className="card" style={{gridColumn:"1 / -1"}}>
    <div className="card-h"><Ic d="user" s={15} c="var(--ink-3)"/><h3>坐席身份库</h3><span className="ch-sub">一账号可建多个 客服 / 顾问 身份(顾问=人工客服身份分类) · 点徽章切启用态</span><div className="ch-r"><button className="btn sm" onClick={()=>push("新增身份(原型)")}><Ic d="plus" s={13}/>新增</button></div></div>
    <div className="card-b flush">{seats.map(s=><div className="lrow" key={s.name} style={{alignItems:"flex-start"}}><Av name={s.name} size="md"/><div className="lr-main"><div className="lr-ttl">{s.name} <span className="chip muted">{s.role}</span></div><div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:7}}>{s.identities.map(id=><span key={id.id} className={cls("chip",id.type==="advisor"?"advisor":"sky")} title="点击切换启用态" style={{opacity:id.on?1:.4,cursor:"pointer"}} onClick={()=>toggleId(s.name,id)}>{id.type==="advisor"?<Ic d="bolt" s={10}/>:<Ic d="headset" s={10}/>}{id.label} <span style={{opacity:.6}} className="mono">{id.type==="advisor"?"顾问":"客服"}</span>{!id.on&&" · 停用"}</span>)}</div></div><div className="lr-r"><span className="kmono">{s.identities.filter(i=>i.on).length}/{s.identities.length} 启用</span></div></div>)}</div>
   </div>
  </div>
  <ConfirmModal open={!!gate} onClose={()=>setGate(null)} title={gate&&gate.title} sub={gate&&gate.sub} icon="alert" tone={gate&&gate.tone} edit={gate&&gate.edit} onConfirm={()=>{if(gate)gate.run()}}/>
  <ConfirmModal open={!!edit} onClose={()=>setEdit(null)} title="调整推送参数" sub="高敏配置 · 需确认 + 理由" icon="sliders" tone="warn"
    edit={edit&&{kind:edit.kind,current:edit.current,input:true,unit:edit.unit,inputInit:edit.inputInit}}
    onConfirm={(r,nv)=>{const n=parseInt(nv,10);if(!isNaN(n)&&n>=0)setPolicy(p=>({...p,[edit.key]:n}));push("推送参数已更新")}}/>
  {editAud&&<AudienceModal current={policy.audience} onClose={()=>setEditAud(false)} onConfirm={a=>{setPolicy(p=>({...p,audience:a}));setEditAud(false);push("受众范围已更新")}}/>}
 </div>;
}
function AudienceModal({current,onClose,onConfirm}){
 const[aid,setAid]=useState(AUDIENCES[0].id);const[val,setVal]=useState(null);const[r,setR]=useState("");const[conds,setConds]=useState([]);
 useEsc(true,onClose);
 const a=AUDIENCES.find(x=>x.id===aid);const vals=AUD_VALUES[aid];
 const label=aid==="custom"?("自定义 · "+segSummary(conds)):a.label+(val?` · ${val}`:"");
 const canDo=r.trim()&&label!==current&&(aid==="custom"?segValid(conds):(!vals||val));
 return <div className="scrim" onClick={onClose}><div className="modal" onClick={e=>e.stopPropagation()}>
  <div className="m-head"><div className="m-ic" style={{background:"var(--warn-soft)",color:"var(--warn)"}}><Ic d="users" s={18}/></div><div style={{flex:1}}><h3>受众圈定</h3><div className="m-sub">主动推送投放人群 · 受众画像维度 + 自定义多条件圈选</div></div></div>
  <div className="m-body">
   <div className="edit-box"><div><div className="eb-k">当前</div><div className="eb-v">{current}</div></div><span style={{color:"var(--ink-5)"}}><Ic d="arrow" s={18}/></span><div style={{minWidth:0}}><div className="eb-k">目标新值</div><div className="eb-v eb-new" style={{fontSize:12,whiteSpace:"normal"}}>{aid==="custom"&&!segValid(conds)?"（待构建条件）":label}</div></div></div>
   <div className="opt-grid">{AUDIENCES.map(x=><div key={x.id} className={cls("opt",aid===x.id&&"on")} onClick={()=>{setAid(x.id);setVal(null)}}><span className="o-rd"/><div className="o-main"><div className="o-ttl">{x.label}</div><div className="o-sub">{x.sub}</div></div></div>)}</div>
   {vals&&<div className="val-row">{vals.map(v=><button key={v} className={cls("val-chip",val===v&&"on")} onClick={()=>setVal(v)}>{v}</button>)}</div>}
   {aid==="custom"&&<div style={{marginTop:12}}><CustomSegment conds={conds} setConds={setConds}/></div>}
   <div className="fld" style={{marginTop:15,marginBottom:0}}><label>操作理由 <span style={{color:"var(--bad)"}}>*</span></label><textarea className="inp" value={r} placeholder="简述调整受众的业务理由…" onChange={e=>setR(e.target.value)}/></div>
  </div>
  <div className="m-foot"><div className="lft"><Ic d="shield" s={13}/>写入操作审计</div><button className="btn ghost" onClick={onClose}>取消</button><button className="btn pri" disabled={!canDo} onClick={()=>onConfirm(label,r)}>确认</button></div>
 </div></div>;
}

/* ============ APP ============ */
const PAGES=[
 {id:"M1",label:"客服总览",ic:"inbox"},
 {id:"M2",label:"工单台",ic:"ticket"},
 {id:"M3",label:"即时会话台",ic:"chat"},
 {id:"M4",label:"知识库与 SLA",ic:"book"},
 {id:"M5",label:"话术与模板",ic:"sliders"},
];
const DOMAINS=["A","B","C","D","E","F","G","H","I","J","K","L","M"];
function App(){
 const[page,setPage]=useState("M1");
 const[toasts,push]=useToast();
 const[lastConvo,setLastConvo]=useState("cv-2042");
 const waitReply=SESSIONS.filter(s=>s.status==="open"&&(s.thread.filter(m=>m.who!=="sys").slice(-1)[0]||{}).who==="user").length;
 return <div className="shell">
  <div className="rail"><div className="rail-logo">N</div>{DOMAINS.map(d=><div key={d} className={cls("rail-d",d==="M"&&"on")} title={d==="M"?"客服中心":"域 "+d}>{d}</div>)}</div>
  <div className="main">
   <div className="top">
    <div className="crumb"><span className="dom"><span className="dot"/>客服中心</span><span className="sep">/</span><span className="code">M · service</span></div>
    <div className="tabs">{PAGES.map(p=><button key={p.id} className={cls("tab",page===p.id&&"on")} onClick={()=>setPage(p.id)}><Ic d={p.ic} s={14}/>{p.label}<span className="tcode">{p.id}</span></button>)}</div>
    <div className="top-r"><button className="inbox-pill" onClick={()=>setPage("M3")} title="待回复会话 · 跳即时会话台"><Ic d="headset" s={15}/>待回复{waitReply>0&&<span className="badge">{waitReply}</span>}</button><div className="me"><Av name={ME} size="md"/><div><div className="nm">Mia</div><div className="rl">客服坐席 · support</div></div></div></div>
   </div>
   {page==="M1"&&<M1Overview go={setPage} push={push}/>}
   {page==="M2"&&<M2Tickets push={push}/>}
   {page==="M3"&&<M3Sessions push={push} lastConvo={lastConvo} setLastConvo={setLastConvo}/>}
   {page==="M4"&&<M4KbSla push={push}/>}
   {page==="M5"&&<M5Scripts push={push}/>}
  </div>
  <Toasts items={toasts}/>
 </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
